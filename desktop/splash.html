<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AgentFusion</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; background: #f8f9fb; color: #0f172a;
    font-family: "Plus Jakarta Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", sans-serif;
    -webkit-user-select: none; user-select: none; }
  .wrap { height: 100%; display: grid; place-items: center; -webkit-app-region: drag; }
  .box { text-align: center; transform: translateY(-10px); width: 320px; }
  .mark { width: 52px; height: 52px; margin: 0 auto 18px; color: #0f172a;
    display: grid; place-items: center; border-radius: 14px;
    background: #ffffff; border: 1px solid rgba(15, 23, 42, 0.08);
    box-shadow: 0 8px 24px -8px rgba(15, 23, 42, 0.12); }
  .mark svg { width: 30px; height: 30px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.015em; }
  p { font-size: 12px; color: #64748b; margin: 0; min-height: 17px; }
  .dots { display: inline-flex; gap: 4px; margin-left: 7px; vertical-align: 2px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: #2563eb; animation: d 1.1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes d { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-3px); opacity: 1; } }
  .bar { margin: 18px auto 0; width: 152px; height: 2px; border-radius: 2px; background: rgba(15, 23, 42, .08); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 38%; border-radius: 2px; background: #2563eb;
    animation: slide 1.5s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(300%); } }
  .foot { position: fixed; left: 0; right: 0; bottom: 18px; text-align: center;
    font-size: 11px; color: #94a3b8; letter-spacing: .01em; }
  .err { color: #dc2626; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 4.5 5.4 16.8h13.2L12 4.5Z" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round" opacity="0.4"/>
          <circle cx="12" cy="5" r="2.2" fill="#0f172a"/>
          <circle cx="5.8" cy="16.6" r="2" fill="#0f172a" opacity="0.82"/>
          <circle cx="18.2" cy="16.6" r="2" fill="#0f172a" opacity="0.82"/>
          <circle cx="12" cy="12.6" r="1.9" fill="#2563eb"/>
        </svg>
      </div>
      <h1>AgentFusion</h1>
      <p id="status">正在启动本地运行时<span class="dots"><i></i><i></i><i></i></span></p>
      <div class="bar"><i></i></div>
    </div>
  </div>
  <div class="foot">群聊智能体工作台 · pi 内核</div>
<script>
  window.__splashStatus = function (text) {
    var el = document.getElementById('status');
    if (!el) return;
    el.innerHTML = String(text || '') + '<span class="dots"><i></i><i></i><i></i></span>';
  };
  window.__splashError = function (text) {
    var el = document.getElementById('status');
    if (!el) return;
    el.className = 'err';
    el.textContent = String(text || '启动失败');
    var bar = document.querySelector('.bar');
    if (bar) bar.style.display = 'none';
  };
</script>
</body>
</html>
