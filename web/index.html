<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentFusion</title>
<meta name="description" content="AgentFusion — 群聊智能体工作台 · pi 内核">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app" id="app">

  <header class="titlebar" id="titlebar">
    <div class="tb-left">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="7.2" cy="7.6" r="3.1"/><circle cx="16.8" cy="7.6" r="3.1"/><circle cx="12" cy="16.6" r="3.4"/></svg>
      </span>
      <span class="brand-name">AgentFusion</span>
      <span class="brand-sub">群聊智能体工作台 · pi 内核</span>
    </div>
    <div class="tb-center">
      <div class="tb-title" id="tb-title">Chief</div>
    </div>
    <div class="tb-right">
      <span class="conn-pill" id="conn-pill" title="网络连接状态" aria-label="网络连接状态"><span class="conn-dot" id="conn-dot"></span><span id="conn-text">连接中</span></span>
      <button class="tb-btn" id="btn-theme-toggle" title="切换深浅主题" aria-label="切换深浅主题">
        <span class="theme-icon-sun" aria-hidden="true"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.8"/><path d="M10 2.5v2m0 11v2M2.5 10h2m11 0h2m-10.7-5.3 1.4 1.4m9.6 9.6 1.4 1.4m-12.4 0 1.4-1.4m9.6-9.6 1.4-1.4"/></svg></span>
        <span class="theme-icon-moon" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M17.2 12.8A7.5 7.5 0 0 1 7.2 2.8 8 8 0 1 0 17.2 12.8Z"/></svg></span>
      </button>
      <div class="win-btns" id="win-btns" hidden>
        <button class="win-btn" id="win-min" aria-label="最小化"><svg viewBox="0 0 16 16"><path d="M3.5 8.5h9"/></svg></button>
        <button class="win-btn" id="win-max" aria-label="最大化"><svg viewBox="0 0 16 16"><rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1"/></svg></button>
        <button class="win-btn win-close" id="win-close" aria-label="关闭"><svg viewBox="0 0 16 16"><path d="m4.6 4.6 6.8 6.8m0-6.8-6.8 6.8"/></svg></button>
      </div>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar" id="sidebar" data-mode="expanded" aria-label="侧边导航">
      <div class="side-head">
        <div class="side-head-top">
          <button class="side-toggle-btn" id="btn-toggle-sidebar" title="折叠侧边栏（Ctrl+B）" aria-label="切换侧边栏" aria-expanded="true">
            <svg class="icon-collapse" viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 3v14" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m13 8-2 2 2 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="icon-expand" viewBox="0 0 20 20" hidden><rect x="3" y="3" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 3v14" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m11 8 2 2-2 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="tool-btn" id="btn-search" title="搜索（Ctrl+K）" aria-label="搜索">
            <svg viewBox="0 0 20 20"><circle cx="8.8" cy="8.8" r="4.7"/><path d="m12.4 12.4 3.3 3.3"/></svg>
          </button>
        </div>
        <button class="new-pill-btn" id="btn-new" title="新建群聊（Ctrl+N）" aria-label="新建群聊">
          <svg viewBox="0 0 20 20"><path d="M10 4.4v11.2M4.4 10h11.2"/></svg>
          <span class="new-pill-text">新建群聊</span>
          <kbd class="shortcut-hint">Ctrl N</kbd>
        </button>
      </div>

      <div class="side-scroll" id="side-scroll">
        <section class="side-sec">
          <header class="side-sec-head">
            <span class="sec-label">群聊</span>
            <button class="mini-btn" id="btn-new-room" title="新建群聊" aria-label="新建群聊">
              <svg viewBox="0 0 20 20"><path d="M10 4.8v10.4M4.8 10h10.4"/></svg>
            </button>
          </header>
          <div class="room-list" id="room-list"></div>
          <div class="side-empty" id="room-empty">还没有群聊</div>
        </section>

        <section class="side-sec">
          <header class="side-sec-head"><span class="sec-label">机器人</span></header>
          <div class="bot-list" id="bot-list"></div>
        </section>
      </div>

      <div class="side-foot" id="side-foot">
        <button class="chief-card" id="chief-card" title="Chief · 智能体总管（对话）" aria-label="Chief 智能体总管">
          <span class="chief-orb" id="chief-orb"></span>
          <span class="chief-meta">
            <span class="chief-name">Chief</span>
            <span class="chief-role">总管</span>
          </span>
          <span class="chief-arrow" aria-hidden="true">
            <svg viewBox="0 0 20 20"><path d="m7.5 4.8 5.2 5.2-5.2 5.2"/></svg>
          </span>
        </button>

        <div class="side-status-row" id="side-status-row">
          <div class="side-conn-badge ok" id="side-conn-badge" title="服务连接状态">
            <span class="status-lamp" id="side-conn-dot"></span>
            <span class="status-text" id="side-conn-text">已连接</span>
          </div>
          <span class="foot-model" id="foot-model">DeepSeek V4.1 Flash</span>
        </div>

        <div class="side-foot-actions">
          <button class="foot-btn" id="btn-usage" title="用量与上下文">
            <svg viewBox="0 0 20 20"><path d="M4 15.5V10m6 5.5V5m6 10.5v-7"/></svg>
            <span class="foot-btn-label">用量</span>
            <span class="foot-num" id="foot-usage">0</span>
          </button>
          <button class="foot-btn" id="btn-settings" title="设置（Ctrl+,）">
            <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 3.2v1.6m0 10.4v1.6M3.2 10h1.6m10.4 0h1.6M5.2 5.2l1.1 1.1m7.4 7.4 1.1 1.1m0-9.6-1.1 1.1m-7.4 7.4-1.1 1.1"/></svg>
            <span class="foot-btn-label">设置</span>
            <span class="foot-badge" id="approval-badge" hidden></span>
          </button>
        </div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="view" id="view" role="main"></div>
    </main>

    <aside class="inspector inspector-drawer" id="inspector" hidden></aside>
  </div>
</div>

<div class="modal-root" id="modal-root"></div>
<div class="toast-root" id="toast-root" aria-live="polite"></div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
